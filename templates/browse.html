<!DOCTYPE html>
<html>
	<head>
		<title>{{.Name}}</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			body { padding: 20px; font-family: sans-serif; background: #fff; color: #333; }
			h1 { font-size: 1.5em; margin-bottom: 20px; word-break: break-all; }
			a { color: #0066cc; text-decoration: none; }
			a:hover { text-decoration: underline; }
			table { width: 100%; border-collapse: collapse; margin-top: 10px; }
			th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
			th { background: #f5f5f5; }
			.size { text-align: right; }
		</style>
	</head>
	<body>
		<h1>📋 文件列表: {{.Path}}</h1>
		<table>
			<thead>
				<tr>
					<th>名称</th>
					<th>修改时间</th>
					<th class="size">大小</th>
				</tr>
			</thead>
			<tbody>
				{{if .CanGoUp}}
				<tr>
					<td><a href="..">📁 .. (返回上级)</a></td>
					<td>-</td>
					<td class="size">-</td>
				</tr>
				{{end}}
				{{range .Items}}
				<tr>
					<td><a href="{{.URL}}">{{if .IsDir}}📁{{else}}📄{{end}} {{.Name}}</a></td>
					<td>{{.HumanModTime "2006-01-02 15:04:05"}}</td>
					<td class="size">{{if .IsDir}}-{{else}}{{.HumanSize}}{{end}}</td>
				</tr>
				{{end}}
			</tbody>
		</table>
	</body>
</html>
